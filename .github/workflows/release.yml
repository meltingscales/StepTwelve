name: Release

# Push a tag like v1.2.3 to build a signed APK and publish it on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"; fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STEPTWELVE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing STEPTWELVE_KEYSTORE_BASE64 secret. See README > Releasing."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STEPTWELVE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          STEPTWELVE_KEYSTORE_PASSWORD: ${{ secrets.STEPTWELVE_KEYSTORE_PASSWORD }}
          STEPTWELVE_KEY_ALIAS: ${{ secrets.STEPTWELVE_KEY_ALIAS }}
          STEPTWELVE_KEY_PASSWORD: ${{ secrets.STEPTWELVE_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease

      - name: Verify signature and prepare assets
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          OUT="steptwelve-$VERSION_NAME.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_FILE" "$APK_FILE.sha256" \
            --title "StepTwelve $VERSION_NAME" --generate-notes $PRERELEASE

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
